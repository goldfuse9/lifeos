<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LifeOS">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Jen skořápka. Vzhled je celý v deskách z plátna a tenhle soubor
     do něj nesmí mluvit — jediná výjimka je roztažení desky z 390×844
     na skutečnou obrazovku telefonu. */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #FFFFFF;
    overscroll-behavior-y: none;
  }
  #deska { min-height: 100dvh; }

  /* Deska je nakreslená na 390×844. V telefonu má vyplnit displej —
     vnitřek je flexibilní (padding, flex, absolute inset:0), takže
     stačí přebít ty dva rozměry na kořeni. */
  #deska > div {
    width: 100% !important;
    min-height: 100dvh !important;
    height: 100dvh !important;
  }

  #nacitam {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font: 15px/1.4 system-ui, sans-serif; color: #514F57;
  }
  #nacitam[hidden] { display: none; }

  #chyba {
    margin: 0; padding: 24px;
    font: 15px/1.5 system-ui, sans-serif; color: #7A4300;
    background: #FFF1E0;
  }
  #chyba[hidden] { display: none; }
</style>
</head>
<body>

<div id="deska" role="application" aria-label="LifeOS"></div>
<p id="nacitam">Načítám…</p>
<pre id="chyba" hidden></pre>

<script src="dc.js"></script>
<script src="shell.js"></script>
</body>
</html>
