<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Nouzová karta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#FFFFFF;color:#17161A;-webkit-font-smoothing:antialiased}
a{color:#17161A;text-decoration:none}a:hover{color:#000}
.nk-scroll{scrollbar-width:none}
.nk-scroll::-webkit-scrollbar{display:none}
button:focus-visible,a:focus-visible{outline:2px solid #17161A;outline-offset:2px}
@keyframes nkPulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{ui.bg}}; transition: background 300ms ease; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <sc-if value="{{ui.glass}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;">
      <span style="position: absolute; top: -150px; right: -150px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, {{ui.b1}} 0%, rgba(255,255,255,0) 68%);"></span>
      <span style="position: absolute; top: 40px; left: -170px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, {{ui.b4}} 0%, rgba(255,255,255,0) 66%);"></span>
      <span style="position: absolute; top: 380px; left: -150px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, {{ui.b2}} 0%, rgba(255,255,255,0) 66%);"></span>
      <span style="position: absolute; bottom: -170px; right: -130px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, {{ui.b3}} 0%, rgba(255,255,255,0) 68%);"></span>
    </div>
  </sc-if>
  <div class="nk-scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 48px 16px 120px; box-sizing: border-box;">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
      <a href="Prehled.dc.html" aria-label="Zpět na přehled" style="width: 44px; height: 44px; border-radius: 22px; background: {{ui.pill}}; backdrop-filter: {{ui.blur}}; -webkit-backdrop-filter: {{ui.blur}}; color: #514F57; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <span role="status" aria-label="Zobrazená karta: {{chip.name}}" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; background: {{ui.pill}}; backdrop-filter: {{ui.blur}}; -webkit-backdrop-filter: {{ui.blur}}; font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.01em; color: #17161A;">{{chip.name}}</span>
    </div>
    <div style="margin-top: 18px; padding-left: 8px;">
      <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.03em; color: #17161A;">Nouzová karta</h1>
      <div style="margin-top: 4px; font-size: 14px; line-height: 20px; color: #514F57;">Tohle a nic víc uvidí záchranář, když načte kód. Otevření vám přijde jako zpráva.</div>
    </div>

    <section style="margin-top: 16px; padding: 24px 16px 20px; background: {{ui.card}}; border: 1px solid {{ui.line}}; backdrop-filter: {{ui.blur}}; -webkit-backdrop-filter: {{ui.blur}}; box-shadow: {{ui.shadow}}; border-radius: 28px; display: flex; flex-direction: column; align-items: center;">
      <div role="img" aria-label="Kód nouzové karty pro záchranáře" style="position: relative; width: 216px; height: 216px; box-sizing: border-box; padding: 16px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 8px 24px rgba(40,28,64,0.06); opacity: {{qrOpacity}}; transition: opacity 300ms ease;">
        <div style="display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); width: 184px; height: 184px;">
          <sc-for list="{{qr}}" as="c" hint-placeholder-count="625">
            <span style="display: block; background: {{c.c}}; border-radius: 1.5px;"></span>
          </sc-for>
        </div>
        <sc-if value="{{expired}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #17161A;">Kód vypršel</span>
        </sc-if>
      </div>
      <div style="margin-top: 16px; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.02em;">{{card.fullName}}</div>
      <div style="margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 16px; background: {{timer.bg}}; color: {{timer.fg}}; font-size: 14px; line-height: 20px; font-weight: 600; font-variant-numeric: tabular-nums;">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{timer.dot}}; animation: nkPulse 1.6s ease-in-out infinite;"></span>
        <span>{{timer.label}}</span>
      </div>
    </section>

    <section style="margin-top: 16px; padding: 4px 16px; background: {{ui.card}}; border: 1px solid {{ui.line}}; backdrop-filter: {{ui.blur}}; -webkit-backdrop-filter: {{ui.blur}}; box-shadow: {{ui.shadow}}; border-radius: 24px;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid {{r.divider}};">
          <span style="flex-shrink: 0; font-size: 14px; line-height: 20px; color: #514F57;">{{r.label}}</span>
          <span style="font-size: 14px; line-height: 20px; font-weight: 600; text-align: right;">{{r.value}}</span>
        </div>
      </sc-for>
    </section>

    <p style="margin: 16px 0 0; padding: 4px 0 4px 12px; border-left: 2px solid #E4E2DE; font-size: 13px; line-height: 20px; color: #514F57;">Zbytek karty zůstane zavřený — žádná časová osa, žádné dokumenty. Kód se dá kdykoli zneplatnit a vytvořit nový.</p>

    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px;">
      <button onClick="{{renew}}" style="min-height: 52px; border: 0; border-radius: 26px; background: #17161A; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 24px rgba(0,0,0,0.14);">Zneplatnit a vytvořit nový kód</button>
      <button style="min-height: 52px; border: 1px solid {{ui.line}}; border-radius: 26px; background: {{ui.card}}; backdrop-filter: {{ui.blur}}; -webkit-backdrop-filter: {{ui.blur}}; color: #17161A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Co je v nouzové kartě</button>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 128px; z-index: 7; pointer-events: none; background: {{ui.fadeBottom}};"></div>
  <a href="Prehled.dc.html" aria-label="Zpět na přehled" style="position: absolute; bottom: 32px; right: 16px; z-index: 19; width: 56px; height: 56px; box-sizing: border-box; border-radius: 28px; border: 1px solid {{me.border}}; background: {{me.bg}}; color: {{me.fg}}; box-shadow: {{me.shadow}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; letter-spacing: 0.02em;">
    <span aria-hidden="true" style="position: absolute; inset: 7px; border-radius: 20px; border: 1px solid {{me.ring}};"></span>
    <span style="position: relative;">TA</span>
  </a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"enum","options":["čiré sklo","teplé sklo","chladné sklo","bílé"],"default":"čiré sklo","section":"Vzhled"},"card":{"editor":"enum","options":["Tereza","Roman","Matheo","Oliver"],"default":"Tereza","section":"Náhled"},"avatarStyle":{"editor":"enum","options":["limetková","černá"],"default":"limetková","section":"Vzhled"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { left: 14 * 60 + 32, seed: 7 };
  }

  componentDidMount() {
    var self = this;
    this._t = setInterval(function () {
      if (self.state.left > 0) self.setState({ left: self.state.left - 1 });
    }, 1000);
  }

  componentWillUnmount() { clearInterval(this._t); }

  renderVals() {
    var self = this;
    var st = this.state;
    var bgMode = this.props.bg || "čiré sklo";
    var glass = bgMode !== "bílé";
    var cool = bgMode === "chladné sklo";
    // „Čiré sklo“ je sklo bez barevného mraku: plochy zůstanou průsvitné
    // a rozostřené, ale podklad je skoro bílý a skvrny jsou sotva znát.
    var cire = bgMode === "čiré sklo";
    var bgRgb = cire ? "252,251,250" : (cool ? "242,243,246" : "244,243,240");
    var ui = glass ? {
      glass: true, bg: "rgb(" + bgRgb + ")",
      b1: cire ? "rgba(247,179,199,0.16)" : (cool ? "rgba(178,204,250,0.60)" : "rgba(247,179,199,0.55)"),
      b2: cire ? "rgba(215,242,58,0.10)" : (cool ? "rgba(170,232,214,0.40)" : "rgba(215,242,58,0.22)"),
      b3: cire ? "rgba(200,170,245,0.12)" : (cool ? "rgba(196,172,246,0.42)" : "rgba(200,170,245,0.34)"),
      b4: cire ? "rgba(251,206,160,0.16)" : (cool ? "rgba(214,226,252,0.70)" : "rgba(251,206,160,0.42)"),
      // Na skoro bílém podkladu nejde okraj kreslit bílou — musí to být
      // vlasová tmavá linka, jinak rámeček zmizí.
      card: cire ? "rgba(255,255,255,0.70)" : "rgba(255,255,255,0.56)",
      cardW: cire ? "rgba(255,255,255,0.88)" : "rgba(255,255,255,0.56)",
      line: cire ? "rgba(23,22,26,0.055)" : "rgba(255,255,255,0.88)",
      tile: cire ? "rgba(255,255,255,0.58)" : "rgba(255,255,255,0.44)",
      tileLine: cire ? "rgba(23,22,26,0.05)" : "rgba(255,255,255,0.8)",
      blur: cire ? "blur(20px) saturate(150%)" : "blur(24px) saturate(160%)",
      shadow: cire
        ? "inset 0 1px 0 rgba(255,255,255,0.95), 0 6px 20px rgba(40,38,48,0.055), 0 1px 2px rgba(40,38,48,0.04)"
        : "inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 30px rgba(70,56,90,0.06)",
      pill: cire ? "rgba(255,255,255,0.80)" : "rgba(255,255,255,0.64)",
      pillInner: cire ? "#FFFFFF" : "#FAF9F8", seg: "#FFFFFF", rule: "rgba(23,22,26,0.07)",
      fadeBottom: "linear-gradient(to top, rgba(" + bgRgb + ",0.94) 0%, rgba(" + bgRgb + ",0.7) 40%, rgba(" + bgRgb + ",0) 100%)",
      fadeTop: "linear-gradient(to bottom, rgba(" + bgRgb + ",0.94) 0%, rgba(" + bgRgb + ",0.86) 55%, rgba(" + bgRgb + ",0.5) 74%, rgba(" + bgRgb + ",0) 100%)"
    } : {
      glass: false, bg: "#FFFFFF", b1: "transparent", b2: "transparent", b3: "transparent", b4: "transparent",
      card: "#F7F7F6", cardW: "#FFFFFF", line: "#EEEEEC", tile: "#F2F2F1", tileLine: "#EEEEEC",
      blur: "none", shadow: "none", pill: "#F4F4F3", pillInner: "#F4F4F3", seg: "#E6E5E2", rule: "#EEEEEC",
      fadeBottom: "linear-gradient(to top, rgba(255,255,255,1) 0%, rgba(255,255,255,0.85) 40%, rgba(255,255,255,0) 100%)",
      fadeTop: "linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(255,255,255,0.97) 55%, rgba(255,255,255,0.7) 74%, rgba(255,255,255,0) 100%)"
    };
    var PEOPLE = [
      { key: "tereza", chip: "Já", fullName: "Tereza Arte", initials: "TA", avatarBg: "linear-gradient(145deg, #FFE9D2 0%, #F8CFA6 100%)",
        rows: [["Krevní skupina", "A Rh+"], ["Alergie", "žádné známé"], ["Léky", "Vitamin D 2 000 IU denně"], ["Zavolat", "Roman (manžel) · [TELEFON]"]] },
      { key: "roman", chip: "Roman", fullName: "Roman Arte", initials: "RA", avatarBg: "linear-gradient(145deg, #E6EEFC 0%, #C9D8F6 100%)",
        rows: [["Krevní skupina", "0 Rh+"], ["Alergie", "penicilin"], ["Léky", "žádné trvalé"], ["Zavolat", "Tereza (manželka) · [TELEFON]"]] },
      { key: "matheo", chip: "Matheo", fullName: "Matheo Arte", initials: "MA", avatarBg: "linear-gradient(145deg, #E2F5F9 0%, #BFE6EF 100%)",
        rows: [["Krevní skupina", "neuvedena"], ["Alergie", "pyl (sezónně)"], ["Léky", "Paralen 250 mg při horečce"], ["Zavolat", "Tereza (máma) · [TELEFON]"]] },
      { key: "oliver", chip: "Oliver", fullName: "Oliver Arte", initials: "OA", avatarBg: "linear-gradient(145deg, #F3E9FD 0%, #DEC8F7 100%)",
        rows: [["Krevní skupina", "neuvedena"], ["Alergie", "žádné známé"], ["Léky", "žádné"], ["Zavolat", "Tereza (máma) · [TELEFON]"]] }
    ];
    var CHIPS = {
      tereza: { name: "Tereza", meta: "Hlavní karta", ring: 220, initials: "TA", avatarBg: "linear-gradient(145deg, #FFE9D2 0%, #F8CFA6 100%)" },
      roman:  { name: "Roman",  meta: "Manžel",       ring: 140, initials: "RA", avatarBg: "linear-gradient(145deg, #E6EEFC 0%, #C9D8F6 100%)" },
      matheo: { name: "Matheo", meta: "Syn · 8 let",  ring: 280, initials: "MA", avatarBg: "linear-gradient(145deg, #E2F5F9 0%, #BFE6EF 100%)" },
      oliver: { name: "Oliver", meta: "Syn · 4 roky", ring: 180, initials: "OA", avatarBg: "linear-gradient(145deg, #F3E9FD 0%, #DEC8F7 100%)" }
    };
    var cardKey = ({ Tereza: "tereza", Roman: "roman", Matheo: "matheo", Oliver: "oliver" })[this.props.card || "Tereza"] || "tereza";
    var chip = CHIPS[cardKey];
    var person = PEOPLE.filter(function (p) { return p.key === cardKey; })[0] || PEOPLE[0];
    var N = 25;
    var seed = st.seed * 9301 + person.key.length * 49297;
    var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    var finder = function (r, c) {
      var corners = [[0, 0], [0, N - 7], [N - 7, 0]];
      for (var k = 0; k < 3; k++) {
        var rr = r - corners[k][0], cc = c - corners[k][1];
        if (rr >= -1 && rr <= 7 && cc >= -1 && cc <= 7) {
          if (rr < 0 || rr > 6 || cc < 0 || cc > 6) return 0;
          if (rr === 0 || rr === 6 || cc === 0 || cc === 6) return 1;
          if (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4) return 1;
          return 0;
        }
      }
      return -1;
    };
    var qr = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var f = finder(r, c);
        var on;
        if (f !== -1) on = f === 1;
        else if (r === 6) on = c % 2 === 0;
        else if (c === 6) on = r % 2 === 0;
        else on = rnd() > 0.52;
        qr.push({ c: on ? "#17161A" : "transparent" });
      }
    }

    var left = st.left;
    var mm = Math.floor(left / 60), ss = left % 60;
    var expired = left <= 0;
    var timer = expired
      ? { label: "Kód vypršel", bg: "#F1F0EE", fg: "#514F57", dot: "#514F57" }
      : { label: "Kód platí ještě " + mm + ":" + (ss < 10 ? "0" : "") + ss, bg: "#FFF1E0", fg: "#7A4300", dot: "#F7931E" };

    var rows = person.rows.map(function (x, i) {
      return { label: x[0], value: x[1], divider: i === person.rows.length - 1 ? "transparent" : ui.rule };
    });

    var limeMe = (this.props.avatarStyle || "limetková") === "limetková";
    var me = limeMe
      ? { bg: "radial-gradient(circle at 50% 45%, #D7F23A 0%, #C6E82E 50%, #E6F7A0 100%)", fg: "#17161A", border: "rgba(255,255,255,0.4)",
          ring: "rgba(23,22,26,0.18)", shadow: "0 12px 32px rgba(160,200,20,0.45), inset 0 1px 0 rgba(255,255,255,0.5)" }
      : { bg: "#17161A", fg: "#FFFFFF", border: "rgba(255,255,255,0.08)",
          ring: "rgba(255,255,255,0.25)", shadow: "0 12px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.12)" };
    return {
      ui: ui,
      me: me,
      chip: chip,
      card: { fullName: person.fullName, initials: person.initials, avatarBg: person.avatarBg },
      qr: qr,
      qrOpacity: expired ? 0.12 : 1,
      expired: expired,
      timer: timer,
      rows: rows,
      renew: function () { self.setState({ left: 14 * 60 + 59, seed: self.state.seed + 11 }); }
    };
  }
}
</script>
</body>
</html>
